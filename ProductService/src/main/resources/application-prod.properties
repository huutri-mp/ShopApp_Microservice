spring.application.name=ProductService

server.port=8082

# gRPC server configuration
grpc.server.port=9092

spring.datasource.url=jdbc:mysql://shop-app.mysql.database.azure.com:3306/product_service_db?useSSL=true&serverTimezone=UTC
spring.datasource.username=shopadmin
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.kafka.bootstrap-servers=kafka-namespace-tri.servicebus.windows.net:9093
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://kafka-namespace-tri.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=xK/lBTcY8fGIpEAIyJm0VtcfoDmZEfltG+AEhK8CbKo=";

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

azure.storage.container-name:product-image

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

grpc.client.upload-service.address=${GPRC_UPLOAD_SERVICE_ADDRESS}
grpc.client.upload-service.negotiationType=PLAINTEXT
