# App name & port
spring.application.name=ElasticsearchSearchService
server.port=8089

# Kafka
spring.kafka.bootstrap-servers=localhost:9094

spring.kafka.consumer.group-id=search-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.commonlib.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.commonlib.dto.ProductEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.auto-offset-reset=earliest


spring.data.elasticsearch.client.reactive.endpoints=localhost:9200
spring.data.elasticsearch.client.reactive.use-ssl=false
spring.data.elasticsearch.repositories.enabled=true