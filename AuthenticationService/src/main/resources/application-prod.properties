
spring.application.name=AuthenticationService
server.port=8081
spring.cloud.compatibility-verifier.enabled=false

logging.level.org.springframework.security=DEBUG

# gRPC server configuration
grpc.server.port=9081

# gRPC client configuration
grpc.client.profile-service.address=${PROFILE_SERVICE_URL}
grpc.client.profile-service.negotiationType=PLAINTEXT

grpc.client.upload-service.address=${UPLOAD_SERVICE_URL}
grpc.client.upload-service.negotiationType=PLAINTEXT

spring.datasource.url=jdbc:mysql://shop-app.mysql.database.azure.com:3306/auth_service_db?useSSL=true&serverTimezone=UTC
spring.datasource.username=shopadmin
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.valid-duration=${JWT_VALID_DURATION}
jwt.refresh-valid-duration=${JWT_REFRESH_VALID_DURATION}

# OAuth2 providers
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

facebook.client-id=${FACEBOOK_CLIENT_ID}
facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
facebook.redirect-uri=${FACEBOOK_REDIRECT_URI}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.example=DEBUG

spring.kafka.bootstrap-servers=kafka-namespace-tri.servicebus.windows.net:9093
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://kafka-namespace-tri.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=xK/lBTcY8fGIpEAIyJm0VtcfoDmZEfltG+AEhK8CbKo=";
spring.kafka.consumer.auto-offset-reset=earliest


# Consumer JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
