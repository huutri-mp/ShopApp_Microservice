spring.application.name=ApiGateway
server.port=8888

app.api-prefix=/api/v1

# gRPC configuration for auth service
auth.service.grpc.host=${GRPC-AUTHEN-SERVICE}
auth.service.grpc.port=${GRPC-AUTHEN-SERVICE-PORT}

# gRPC configuration for profile service
profile.service.grpc.host=${GRPC-PROFILE-SERVICE}
profile.service.grpc.port=${GRPC-PROFILE-SERVICE-PORT}


# Route for auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTHEN-SERVICE-URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=${app.api-prefix}/auth/**

# Route for profile-service-user
spring.cloud.gateway.routes[1].id=profile-service
spring.cloud.gateway.routes[1].uri=${PROFILE-SERVICE-URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=${app.api-prefix}/profile/**,${app.api-prefix}/address/**

# Route for product-service-product
spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=${PRODUCT-SERVICE-URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=${app.api-prefix}/products/**,${app.api-prefix}/categories/**,${app.api-prefix}/brands/**

# Route for cart-service
spring.cloud.gateway.routes[3].id=cart-service
spring.cloud.gateway.routes[3].uri=${CART-SERVICE-URL}
spring.cloud.gateway.routes[3].predicates[0]=Path=${app.api-prefix}/cart/**

# Route for order-service
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=${ORDER-SERVICE-URL}
spring.cloud.gateway.routes[4].predicates[0]=Path=${app.api-prefix}/order/**

# Router for payment-service
spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=${PAYMENT-SERVICE-URL}
spring.cloud.gateway.routes[5].predicates[0]=Path=${app.api-prefix}/payment/**

# Route for chat-service
spring.cloud.gateway.routes[6].id=chat-service
spring.cloud.gateway.routes[6].uri=${CHAT-SERVICE-URL}
spring.cloud.gateway.routes[6].predicates[0]=Path=${app.api-prefix}/chat/**

# Route for Search Service
spring.cloud.gateway.routes[7].id=search-service
spring.cloud.gateway.routes[7].uri=${SEARCH-SERVICE-URL}
spring.cloud.gateway.routes[7].predicates[0]=Path=${app.api-prefix}/search/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,https://shop-app-fe-p5o9.vercel.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.org.springframework.web=DEBUG
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
