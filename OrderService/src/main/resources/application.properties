spring.application.name=OrderService
server.port=8184
spring.cloud.compatibility-verifier.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

product.service.url=http://product-service:8082/api/v1/internal/product
cart.service.url=http://cart-service:8083/api/v1/internal/cart
address.service.url=http://profile-service:8088/api/v1/internal/address
app.services.profile=http://profile-service:8088/api/v1/internal/profile


spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

auth.username= authUsername
auth.password= authPassword