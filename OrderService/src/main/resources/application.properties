spring.application.name=OrderService
server.port=8084
spring.cloud.compatibility-verifier.enabled=false
grpc.server.port=9084

spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

grpc.client.product-service.address=static://localhost:9092
grpc.client.product-service.negotiationType=PLAINTEXT

grpc.client.profile-service.address=static://localhost:9088
grpc.client.profile-service.negotiationType=PLAINTEXT

grpc.client.payment-service.address=static://localhost:9085
grpc.client.payment-service.negotiationType=PLAINTEXT

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.commonlib.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.commonlib.dto.ProductEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
