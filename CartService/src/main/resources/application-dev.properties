spring.application.name=CartService
spring.cloud.compatibility-verifier.enabled=false
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/cart_service_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

grpc.client.product-service.address=static://localhost:9092
grpc.client.product-service.negotiationType=PLAINTEXT

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.commonlib.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.commonlib.dto.OrderEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

#logging.level.org.apache.kafka=DEBUG
#logging.level.org.springframework.kafka=DEBUG